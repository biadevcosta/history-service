services:
  mysql-history:
    image: mysql:8
    container_name: mysql-history
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: history_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-history-data:/var/lib/mysql

volumes:
  mysql-history-data:
